<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>注册 - 校园二手市场</title>
    <style>
        body { font-family: "微软雅黑"; margin: 40px; }
        input { margin: 5px 0; }
        #result { margin-top: 15px; }
    </style>
</head>
<body>
    <h2>用户注册</h2>
    <form onsubmit="submitRegister(); return false;">
        <p>用户名：<input type="text" id="username"></p>
        <p>密码：<input type="password" id="password"></p>
        <p>邮箱：<input type="text" id="email"></p>
        <p>手机号：<input type="text" id="phone"></p>
        <button id="register-btn">注册</button>
    </form>
    <div id="result"></div>
    <p><a href="/">返回首页</a></p>
    <script>
        async function submitRegister() {
            var data = new URLSearchParams();
            data.append("username", document.getElementById("username").value);
            data.append("password", document.getElementById("password").value);
            data.append("email", document.getElementById("email").value);
            data.append("phone", document.getElementById("phone").value);
            var response = await fetch("/register", { method: "POST", body: data });
            var result = await response.json();
            document.getElementById("result").innerText = "code=" + result.code + "，msg=" + result.msg;
        }
    </script>
</body>
</html>
