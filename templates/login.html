<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>登录 - 校园二手市场</title>
    <style>
        body { font-family: "微软雅黑"; margin: 40px; }
        input { margin: 5px 0; }
        #result { margin-top: 15px; }
    </style>
</head>
<body>
    <h2>用户登录</h2>
    <form onsubmit="submitLogin(); return false;">
        <p>用户名：<input type="text" id="username"></p>
        <p>密码：<input type="password" id="password"></p>
        <button id="login-btn">登录</button>
    </form>
    <div id="result"></div>
    <p><a href="/">返回首页</a></p>
    <script>
        async function submitLogin() {
            var data = new URLSearchParams();
            data.append("username", document.getElementById("username").value);
            data.append("password", document.getElementById("password").value);
            var response = await fetch("/login", { method: "POST", body: data });
            var result = await response.json();
            document.getElementById("result").innerText = "code=" + result.code + "，msg=" + result.msg;
        }
    </script>
</body>
</html>
